[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-similarity"
version = "0.1.0"
description = "Jira issue similarity and duplicate-detection baselines for TAWOS-backed experimentation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = []

[project.optional-dependencies]
mysql = ["PyMySQL"]
api = ["fastapi", "uvicorn"]

[project.scripts]
jira-similarity = "jira_similarity.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
